<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8Sense Launcher</title>
    <style>
        /* --- СБРОС И ОСНОВНЫЕ СТИЛИ (Frutiger Aero Vibes) --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #3a7bd5 0%, #00d2ff 45%, #152b47 100%);
            color: #fff;
        }

        .sense-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 65%),
                linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }

        /* --- ГЛАВНЫЙ КОНТЕЙНЕР --- */
        #launcher {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            padding: 20px 0 0 0;
        }

        /* --- ЧАСЫ HTC SENSE 4.0 --- */
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            perspective: 1000px;
        }

        .clock-widget {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,0.4),
                0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .flip-card {
            position: relative;
            width: 68px;
            height: 90px;
            background: linear-gradient(to bottom, #2c2c2c 0%, #1a1a1a 49%, #0d0d0d 50%, #222222 100%);
            border-radius: 8px;
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.7),
                inset 0 1px 1px rgba(255,255,255,0.5),
                inset 0 -1px 2px rgba(0,0,0,0.8);
            border: 1px solid #000;
            overflow: hidden;
        }

        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #000;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15);
            z-index: 5;
            transform: translateY(-50%);
        }

        .flip-card .number {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: 200;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-family: "Helvetica Neue UltraLight", "Segoe UI Light", sans-serif;
            top: -2px;
        }

        .flip-card.flip .number {
            animation: flipAnim 0.6s ease-in-out;
        }

        @keyframes flipAnim {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); opacity: 0.5; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }

        .clock-dots {
            font-size: 40px;
            font-weight: 300;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-top: -10px;
        }

        .date-display {
            margin-top: 8px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e0f2fe;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        /* ИНДИКАТОРЫ РАБОЧИХ СТОЛОВ (ТОЧКИ) */
        .page-indicators {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }

        .page-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.3s, transform 0.3s;
            cursor: pointer;
        }

        .page-dot.active {
            background: #ffffff;
            transform: scale(1.3);
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }

        /* --- СВАЙПЕР РАБОЧИХ СТОЛОВ --- */
        .desktop-viewports-wrapper {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .desktop-pages-container {
            display: flex;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .desktop-page {
            min-width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
        }

        /* ИНДИКАТОР ПЕРЕХОДА ПО КРАЯМ ПРИ ДРАГ-И-ДРОПЕ */
        .edge-indicator {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 30px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .edge-indicator.left {
            left: 0;
            background: linear-gradient(to right, rgba(56, 189, 248, 0.6), transparent);
        }

        .edge-indicator.right {
            right: 0;
            background: linear-gradient(to left, rgba(56, 189, 248, 0.6), transparent);
        }

        .edge-indicator.active {
            opacity: 1;
            animation: pulseGlow 0.8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        /* СЕТКА ЯЧЕЕК */
        .grid-cell {
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.2s;
        }

        .grid-cell.drag-over {
            background: rgba(255, 255, 255, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.5);
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            transition: transform 0.15s ease, opacity 0.15s;
            width: 100%;
            height: 100%;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .app-item.dragging {
            opacity: 0.4;
        }

        .icon-box {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffffff 0%, #dcdcdc 50%, #b0b0b0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.35),
                inset 0 1px 2px rgba(255,255,255,0.9),
                inset 0 -2px 3px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            overflow: hidden;
            font-size: 26px;
            transition: transform 0.15s ease, filter 0.15s ease;
            flex-shrink: 0;
        }

        .icon-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 12px 12px 100% 100% / 12px 12px 20% 20%;
        }

        .folder-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(200,220,255,0.2) 100%);
            backdrop-filter: blur(10px);
            border: 1.5px dashed rgba(255,255,255,0.7);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px;
            padding: 5px;
        }

        .mini-icon {
            background: rgba(255,255,255,0.6);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .app-title {
            margin-top: 4px;
            font-size: 11px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.8);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65px;
        }

        /* --- НИЖНИЙ ДОК HTC SENSE --- */
        .sense-dock {
            position: relative;
            width: 100%;
            height: 75px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, rgba(200,200,200,0.15) 30%, rgba(0,0,0,0.6) 100%);
            border-top: 2px solid rgba(255,255,255,0.6);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            border-radius: 25px 25px 0 0;
            backdrop-filter: blur(12px);
            z-index: 50;
            box-sizing: border-box;
        }

        .sense-dock .app-item {
            width: auto;
            flex: 1;
            min-width: 0;
            flex-shrink: 1;
        }

        /* Фиксированный идеальный кружок кнопки меню */
        .app-drawer-btn {
            width: 50px;
            height: 50px;
            min-width: 50px;
            min-height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #a8a8a8 70%, #555555 100%);
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.6),
                inset 0 2px 2px rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #222;
            cursor: pointer;
            transition: transform 0.15s ease;
            flex-shrink: 0;
            margin: 0 5px;
        }

        .app-drawer-btn:active {
            transform: scale(0.9);
        }

        .app-drawer-btn::after {
            content: ':::';
            color: #333;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 2px;
        }

        /* --- МЕНЮ ВСЕХ ПРИЛОЖЕНИЙ (APP DRAWER) --- */
        .app-drawer-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(20px);
            z-index: 150;
            display: flex;
            flex-direction: column;
            
            visibility: hidden;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            transition: visibility 0.3s ease, opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .app-drawer-screen.active {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .drawer-title {
            font-size: 18px;
            font-weight: 500;
        }

        .drawer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px 10px;
            padding: 20px 10px;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        .close-drawer-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- МОДАЛЬНОЕ ОКНО ПАПКИ --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.6) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            width: 85%;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        /* --- ЭКРАН НАСТРОЕК --- */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            color: #fff;
            
            visibility: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            transition: visibility 0.3s ease, opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .settings-screen.active {
            visibility: visible;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .settings-header {
            display: flex;
            align-items: center;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .back-btn {
            font-size: 24px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            margin-right: 15px;
            padding: 0 8px;
            transition: transform 0.15s ease, opacity 0.15s;
            border-radius: 50%;
        }

        .back-btn:active {
            transform: scale(0.8);
            opacity: 0.7;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 500;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 12px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.15s ease;
        }

        .settings-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.97);
        }

        .settings-content-body {
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-val {
            font-weight: 600;
            color: #38bdf8;
        }

        .desktop-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .action-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn {
            background: #3b82f6;
            width: 100%;
            padding: 14px;
            border: none;
            color: white;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .tools-bar {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s ease;
            z-index: 20;
        }

        .tools-bar:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="sense-bg-overlay"></div>

    <!-- ИНДИКАТОРЫ КРАЕВ ПРИ ПЕРЕТАСКИВАНИИ -->
    <div class="edge-indicator left" id="edgeLeft"></div>
    <div class="edge-indicator right" id="edgeRight"></div>

    <div id="launcher">
        
        <div class="tools-bar" onclick="resetDesktop()">Сброс значков</div>

        <!-- 1. ЧАСЫ HTC SENSE 4.0 -->
        <div class="clock-container">
            <div class="clock-widget">
                <div class="flip-card" id="card-h1"><span class="number" id="h1">1</span></div>
                <div class="flip-card" id="card-h2"><span class="number" id="h2">2</span></div>
                <div class="clock-dots">:</div>
                <div class="flip-card" id="card-m1"><span class="number" id="m1">0</span></div>
                <div class="flip-card" id="card-m2"><span class="number" id="m2">0</span></div>
            </div>
            <div class="date-display" id="date-text">СР, 19 АВГУСТА</div>
            
            <!-- Индикаторы страниц -->
            <div class="page-indicators" id="pageIndicators"></div>
        </div>

        <!-- 2. МНОГОСТРАНИЧНЫЙ РАБОЧИЙ СТОЛ -->
        <div class="desktop-viewports-wrapper" id="desktopWrapper">
            <div class="desktop-pages-container" id="pagesContainer"></div>
        </div>

        <!-- 3. НИЖНИЙ ДОК -->
        <div class="sense-dock">
            <div class="app-item" onclick="launchApp('com.android.phone')">
                <div class="icon-box" style="background: linear-gradient(135deg, #85d837, #388e3c);">📞</div>
                <span class="app-title">Телефон</span>
            </div>
            
            <div class="app-item" onclick="launchApp('com.android.mms')">
                <div class="icon-box" style="background: linear-gradient(135deg, #29b6f6, #0288d1);">💬</div>
                <span class="app-title">Сообщения</span>
            </div>

            <!-- ШАРИК-КНОПКА МЕНЮ (Ровный и с защитой от сжатия) -->
            <div class="app-drawer-btn" onclick="openAppDrawer()"></div>

            <div class="app-item" onclick="launchApp('com.android.browser')">
                <div class="icon-box" style="background: linear-gradient(135deg, #ffb74d, #f57c00);">🌐</div>
                <span class="app-title">Браузер</span>
            </div>

            <div class="app-item" onclick="launchApp('com.android.camera')">
                <div class="icon-box" style="background: linear-gradient(135deg, #e0e0e0, #757575);">📷</div>
                <span class="app-title">Камера</span>
            </div>
        </div>

    </div>

    <!-- 4. МЕНЮ ВСЕХ ПРИЛОЖЕНИЙ (APP DRAWER) -->
    <div class="app-drawer-screen" id="appDrawerScreen">
        <div class="drawer-header">
            <div class="drawer-title">Все приложения</div>
            <button class="close-drawer-btn" onclick="closeAppDrawer()">✕</button>
        </div>
        <div class="drawer-grid" id="drawerGrid"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПАПКИ -->
    <div class="modal" id="folderModal" onclick="closeFolder(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="folderTitle">Имя папки</div>
            <div class="folder-grid" id="folderGrid"></div>
        </div>
    </div>

    <!-- ЭКРАН НАСТРОЕК -->
    <div class="settings-screen" id="settingsScreen">
        <div class="settings-header">
            <button class="back-btn" onclick="closeLauncherSettings()">←</button>
            <div class="settings-title">Настройки лаунчера</div>
        </div>
        <div class="settings-list">
            <button class="settings-btn" onclick="openSettingsSubscreen('desktops')">
                <span>🖥️ Рабочие столы</span>
                <span>›</span>
            </button>
            <button class="settings-btn" onclick="openSettingsSubscreen('themes')">
                <span>🎨 Темы</span>
                <span>›</span>
            </button>
            <button class="settings-btn" onclick="openSettingsSubscreen('about')">
                <span>ℹ️ О лаунчере</span>
                <span>›</span>
            </button>
        </div>
    </div>

    <!-- ЭКРАН УПРАВЛЕНИЯ РАБОЧИМИ СТОЛАМИ -->
    <div class="settings-screen" id="desktopsScreen" style="z-index: 210;">
        <div class="settings-header">
            <button class="back-btn" onclick="closeSubscreen('desktopsScreen')">←</button>
            <div class="settings-title">Рабочие столы</div>
        </div>
        <div class="settings-content-body">
            <div id="desktopsManagerList"></div>
            <button class="add-btn" onclick="addNewDesktopPage()">+ Добавить рабочий стол</button>
        </div>
    </div>

    <!-- ЭКРАН ТЕМ -->
    <div class="settings-screen" id="themesScreen" style="z-index: 210;">
        <div class="settings-header">
            <button class="back-btn" onclick="closeSubscreen('themesScreen')">←</button>
            <div class="settings-title">Темы</div>
        </div>
        <div class="settings-content-body">
            <div class="info-card" style="text-align: center; padding: 30px 15px;">
                🎨<br><br>
                Пока что нельзя изменить темы в данной версии лаунчера.
            </div>
        </div>
    </div>

    <!-- ЭКРАН О ЛАУНЧЕРЕ -->
    <div class="settings-screen" id="aboutScreen" style="z-index: 210;">
        <div class="settings-header">
            <button class="back-btn" onclick="closeSubscreen('aboutScreen')">←</button>
            <div class="settings-title">О лаунчере</div>
        </div>
        <div class="settings-content-body">
            <div class="info-card">
                <div class="info-row">
                    <span class="info-label">Название:</span>
                    <span class="info-val">8Sense</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Версия:</span>
                    <span class="info-val">1.0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Разработчики:</span>
                    <span class="info-val">8ROM Community</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Оболочка:</span>
                    <span class="info-val">8Sense</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- ИНИЦИАЛИЗАЦИЯ И ДАННЫЕ --- */
        const defaultApps = [
            { id: '1', title: 'Контакты', icon: '👤', package: 'com.android.contacts', type: 'app' },
            { id: '2', title: 'Галерея', icon: '🖼️', package: 'com.cooliris.media', type: 'app' },
            { id: '3', title: 'Музыка', icon: '🎵', package: 'com.htc.music', type: 'app' },
            { id: '4', title: 'Калькулятор', icon: '🔢', package: 'com.android.calculator2', type: 'app' },
            { id: '5', title: 'Часы', icon: '⏰', package: 'com.android.deskclock', type: 'app' },
            { id: '6', title: 'Настройки', icon: '⚙️', package: 'com.android.settings', type: 'app' },
            { id: '7', title: 'Файлы', icon: '📁', package: 'com.android.documentsui', type: 'app' },
            { id: '8', title: 'Настройки лаунчера', icon: '🛠️', package: 'internal.launcher.settings', type: 'internal' }
        ];

        function generateInitialPages() {
            let page1 = new Array(16).fill(null);
            defaultApps.forEach((app, idx) => {
                if (idx < 16) page1[idx] = app;
            });
            return [page1];
        }

        let desktopPages = JSON.parse(localStorage.getItem('8sense_pages_v6')) || generateInitialPages();
        let drawerItems = JSON.parse(localStorage.getItem('8sense_drawer_v6')) || extractAllApps();
        
        let currentPageIndex = 0;
        let dragData = null; // { pageIdx, cellIdx, item, source }

        let edgeTimer = null;
        let edgeDirection = null;

        function extractAllApps() {
            let extracted = [];
            desktopPages.forEach(page => {
                page.forEach(cell => {
                    if (cell) {
                        if (cell.type === 'app' || cell.type === 'internal') {
                            extracted.push(cell);
                        } else if (cell.type === 'folder' && cell.apps) {
                            extracted.push(...cell.apps);
                        }
                    }
                });
            });
            let uniqueMap = {};
            extracted.forEach(item => uniqueMap[item.id] = item);
            return Object.values(uniqueMap);
        }

        /* --- ЗАПУСК ПРИЛОЖЕНИЙ И МОСТ Java --- */
        function launchApp(packageName) {
            if (packageName === 'internal.launcher.settings') {
                openLauncherSettings();
                return;
            }

            if (typeof Android !== 'undefined' && Android.openApp) {
                Android.openApp(packageName);
            } else {
                alert('8Sense [Мост]: Запуск пакета ' + packageName);
            }
        }

        /* --- ЧАСЫ HTS SENSE 4.0 --- */
        let prevTime = "";

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = h + m;

            if (currentTimeStr !== prevTime) {
                updateCard('h1', 'card-h1', h[0]);
                updateCard('h2', 'card-h2', h[1]);
                updateCard('m1', 'card-m1', m[0]);
                updateCard('m2', 'card-m2', m[1]);
                prevTime = currentTimeStr;
            }

            const options = { weekday: 'short', day: 'numeric', month: 'long' };
            document.getElementById('date-text').innerText = now.toLocaleDateString('ru-RU', options).toUpperCase();
        }

        function updateCard(elemId, cardId, newVal) {
            const elem = document.getElementById(elemId);
            const card = document.getElementById(cardId);
            
            if (elem.innerText !== newVal) {
                card.classList.add('flip');
                setTimeout(() => {
                    elem.innerText = newVal;
                }, 300);
                setTimeout(() => {
                    card.classList.remove('flip');
                }, 600);
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        /* --- ОБРАБОТКА ДРАГ-И-ДРОП У КРАЕВ ЭКРАНА --- */
        document.addEventListener('dragover', (e) => {
            if (!dragData || dragData.source !== 'desktop') return;

            const screenWidth = window.innerWidth;
            const mouseX = e.clientX;
            const threshold = 40;

            if (mouseX > screenWidth - threshold && currentPageIndex < desktopPages.length - 1) {
                startEdgeTimer('right');
            } else if (mouseX < threshold && currentPageIndex > 0) {
                startEdgeTimer('left');
            } else {
                clearEdgeTimer();
            }
        });

        document.addEventListener('dragend', () => {
            clearEdgeTimer();
        });

        function startEdgeTimer(dir) {
            if (edgeDirection === dir) return;
            clearEdgeTimer();
            edgeDirection = dir;

            document.getElementById(dir === 'right' ? 'edgeRight' : 'edgeLeft').classList.add('active');

            edgeTimer = setTimeout(() => {
                if (dir === 'right' && currentPageIndex < desktopPages.length - 1) {
                    currentPageIndex++;
                } else if (dir === 'left' && currentPageIndex > 0) {
                    currentPageIndex--;
                }
                renderDesktop();
                clearEdgeTimer();
            }, 1500);
        }

        function clearEdgeTimer() {
            if (edgeTimer) clearTimeout(edgeTimer);
            edgeTimer = null;
            edgeDirection = null;
            document.getElementById('edgeRight').classList.remove('active');
            document.getElementById('edgeLeft').classList.remove('active');
        }

        /* --- ОТРЕСОВКА МНОГОСТРАНИЧНОГО РАБОЧЕГО СТОЛА --- */
        function renderDesktop() {
            const container = document.getElementById('pagesContainer');
            container.innerHTML = '';

            if (currentPageIndex >= desktopPages.length) {
                currentPageIndex = Math.max(0, desktopPages.length - 1);
            }

            desktopPages.forEach((pageCells, pageIdx) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'desktop-page';

                pageCells.forEach((cellItem, cellIdx) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'grid-cell';

                    if (cellItem) {
                        const appDiv = document.createElement('div');
                        appDiv.className = 'app-item';
                        appDiv.draggable = true;

                        if (cellItem.type === 'app' || cellItem.type === 'internal') {
                            appDiv.onclick = () => launchApp(cellItem.package);
                            appDiv.innerHTML = `
                                <div class="icon-box" style="${cellItem.type === 'internal' ? 'background: linear-gradient(135deg, #0288d1, #01579b); color: #fff;' : ''}">${cellItem.icon}</div>
                                <span class="app-title">${cellItem.title}</span>
                            `;
                        } else if (cellItem.type === 'folder') {
                            appDiv.onclick = () => openFolder(pageIdx, cellIdx);
                            let miniIconsHtml = cellItem.apps.slice(0, 4).map(a => `<div class="mini-icon">${a.icon}</div>`).join('');
                            appDiv.innerHTML = `
                                <div class="icon-box folder-box">${miniIconsHtml}</div>
                                <span class="app-title">${cellItem.title}</span>
                            `;
                        }

                        appDiv.addEventListener('dragstart', () => {
                            dragData = { pageIdx, cellIdx, item: cellItem, source: 'desktop' };
                            appDiv.classList.add('dragging');
                        });

                        appDiv.addEventListener('dragend', () => {
                            appDiv.classList.remove('dragging');
                            document.querySelectorAll('.grid-cell').forEach(el => el.classList.remove('drag-over'));
                            clearEdgeTimer();
                        });

                        cellDiv.appendChild(appDiv);
                    }

                    cellDiv.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        cellDiv.classList.add('drag-over');
                    });

                    cellDiv.addEventListener('dragleave', () => {
                        cellDiv.classList.remove('drag-over');
                    });

                    cellDiv.addEventListener('drop', (e) => {
                        e.preventDefault();
                        cellDiv.classList.remove('drag-over');
                        clearEdgeTimer();

                        if (!dragData || dragData.source !== 'desktop') return;

                        const srcPage = dragData.pageIdx;
                        const srcCell = dragData.cellIdx;
                        const targetItem = desktopPages[pageIdx][cellIdx];
                        const sourceItem = desktopPages[srcPage][srcCell];

                        if (srcPage === pageIdx && srcCell === cellIdx) return;

                        if (!targetItem) {
                            desktopPages[pageIdx][cellIdx] = sourceItem;
                            desktopPages[srcPage][srcCell] = null;
                        } 
                        else if ((sourceItem.type === 'app' || sourceItem.type === 'internal') && (targetItem.type === 'app' || targetItem.type === 'internal')) {
                            const folderName = prompt('Имя новой папки:', 'Папка');
                            if (folderName) {
                                desktopPages[pageIdx][cellIdx] = {
                                    type: 'folder',
                                    title: folderName,
                                    apps: [targetItem, sourceItem]
                                };
                                desktopPages[srcPage][srcCell] = null;
                            }
                        } 
                        else if ((sourceItem.type === 'app' || sourceItem.type === 'internal') && targetItem.type === 'folder') {
                            targetItem.apps.push(sourceItem);
                            desktopPages[srcPage][srcCell] = null;
                        } 
                        else {
                            desktopPages[pageIdx][cellIdx] = sourceItem;
                            desktopPages[srcPage][srcCell] = targetItem;
                        }

                        saveAndRender();
                    });

                    pageDiv.appendChild(cellDiv);
                });

                container.appendChild(pageDiv);
            });

            container.style.transform = `translateX(-${currentPageIndex * 100}%)`;

            renderIndicators();
            localStorage.setItem('8sense_pages_v6', JSON.stringify(desktopPages));
        }

        function renderIndicators() {
            const indContainer = document.getElementById('pageIndicators');
            indContainer.innerHTML = '';

            desktopPages.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `page-dot ${idx === currentPageIndex ? 'active' : ''}`;
                dot.onclick = () => {
                    currentPageIndex = idx;
                    renderDesktop();
                };
                indContainer.appendChild(dot);
            });
        }

        let touchStartX = 0;
        let touchEndX = 0;

        const wrapper = document.getElementById('desktopWrapper');
        wrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        wrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const threshold = 40;
            if (touchStartX - touchEndX > threshold) {
                if (currentPageIndex < desktopPages.length - 1) {
                    currentPageIndex++;
                    renderDesktop();
                }
            } else if (touchEndX - touchStartX > threshold) {
                if (currentPageIndex > 0) {
                    currentPageIndex--;
                    renderDesktop();
                }
            }
        }

        function renderDrawer() {
            const grid = document.getElementById('drawerGrid');
            grid.innerHTML = '';

            drawerItems.forEach((item, index) => {
                const appDiv = document.createElement('div');
                appDiv.className = 'app-item';
                appDiv.draggable = true;

                appDiv.onclick = () => {
                    closeAppDrawer();
                    launchApp(item.package);
                };

                appDiv.innerHTML = `
                    <div class="icon-box" style="${item.type === 'internal' ? 'background: linear-gradient(135deg, #0288d1, #01579b); color: #fff;' : ''}">${item.icon}</div>
                    <span class="app-title">${item.title}</span>
                `;

                appDiv.addEventListener('dragstart', () => {
                    dragData = { index, item, source: 'drawer' };
                    appDiv.classList.add('dragging');
                });

                appDiv.addEventListener('dragend', () => {
                    appDiv.classList.remove('dragging');
                    document.querySelectorAll('.app-item').forEach(el => el.classList.remove('drag-over'));
                });

                appDiv.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (dragData && dragData.source === 'drawer' && dragData.index !== index) {
                        appDiv.classList.add('drag-over');
                    }
                });

                appDiv.addEventListener('dragleave', () => {
                    appDiv.classList.remove('drag-over');
                });

                appDiv.addEventListener('drop', (e) => {
                    e.preventDefault();
                    appDiv.classList.remove('drag-over');
                    if (!dragData || dragData.source !== 'drawer' || dragData.index === index) return;

                    const temp = drawerItems[dragData.index];
                    drawerItems[dragData.index] = drawerItems[index];
                    drawerItems[index] = temp;

                    localStorage.setItem('8sense_drawer_v6', JSON.stringify(drawerItems));
                    renderDrawer();
                });

                grid.appendChild(appDiv);
            });

            localStorage.setItem('8sense_drawer_v6', JSON.stringify(drawerItems));
        }

        function openAppDrawer() {
            renderDrawer();
            document.getElementById('appDrawerScreen').classList.add('active');
        }

        function closeAppDrawer() {
            document.getElementById('appDrawerScreen').classList.remove('active');
        }

        function saveAndRender() {
            localStorage.setItem('8sense_pages_v6', JSON.stringify(desktopPages));
            renderDesktop();
        }

        function resetDesktop() {
            desktopPages = generateInitialPages();
            drawerItems = extractAllApps();
            currentPageIndex = 0;
            localStorage.setItem('8sense_drawer_v6', JSON.stringify(drawerItems));
            saveAndRender();
        }

        function openLauncherSettings() {
            document.getElementById('settingsScreen').classList.add('active');
        }

        function closeLauncherSettings() {
            document.getElementById('settingsScreen').classList.remove('active');
        }

        function openSettingsSubscreen(type) {
            if (type === 'themes') {
                document.getElementById('themesScreen').classList.add('active');
            } else if (type === 'about') {
                document.getElementById('aboutScreen').classList.add('active');
            } else if (type === 'desktops') {
                renderDesktopsManager();
                document.getElementById('desktopsScreen').classList.add('active');
            }
        }

        function closeSubscreen(id) {
            document.getElementById(id).classList.remove('active');
        }

        /* --- УПРАВЛЕНИЕ РАБОЧИМИ СТОЛАМИ В НАСТРОЙКАХ (Защита Рабочего стола 1) --- */
        function renderDesktopsManager() {
            const list = document.getElementById('desktopsManagerList');
            list.innerHTML = '';

            desktopPages.forEach((_, idx) => {
                const item = document.createElement('div');
                item.className = 'desktop-manage-item';
                
                // Защита: Рабочий стол 1 (индекс 0) НЕЛЬЗЯ удалить ни при каких условиях
                const canDelete = idx !== 0;

                item.innerHTML = `
                    <span>Рабочий стол ${idx + 1}</span>
                    ${canDelete ? `<button class="action-btn" onclick="removeDesktopPage(${idx})">Удалить</button>` : '<span style="font-size:12px;color:#38bdf8;font-weight:600;">Основной (системный)</span>'}
                `;
                list.appendChild(item);
            });
        }

        function addNewDesktopPage() {
            desktopPages.push(new Array(16).fill(null));
            saveAndRender();
            renderDesktopsManager();
        }

        function removeDesktopPage(idx) {
            // Запрет удаления самого первого рабочего стола (индекс 0)
            if (idx === 0) return;
            
            desktopPages.splice(idx, 1);
            if (currentPageIndex >= desktopPages.length) {
                currentPageIndex = desktopPages.length - 1;
            }
            saveAndRender();
            renderDesktopsManager();
        }

        function openFolder(pageIdx, cellIdx) {
            const folder = desktopPages[pageIdx][cellIdx];
            document.getElementById('folderTitle').innerText = folder.title;
            const folderGrid = document.getElementById('folderGrid');
            folderGrid.innerHTML = '';

            folder.apps.forEach(app => {
                const appDiv = document.createElement('div');
                appDiv.className = 'app-item';
                appDiv.onclick = () => launchApp(app.package);
                appDiv.innerHTML = `
                    <div class="icon-box" style="${app.type === 'internal' ? 'background: linear-gradient(135deg, #0288d1, #01579b); color: #fff;' : ''}">${app.icon}</div>
                    <span class="app-title">${app.title}</span>
                `;
                folderGrid.appendChild(appDiv);
            });

            document.getElementById('folderModal').classList.add('active');
        }

        function closeFolder(e) {
            document.getElementById('folderModal').classList.remove('active');
        }

        renderDesktop();
    </script>
</body>
</html>
